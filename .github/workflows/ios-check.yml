name: iOS Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install pinned Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain 1.98.1
      - name: Prepare Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Verify tag version calculations on macOS
        run: bash scripts/test-ferret-version.sh
      - name: Build, test, and launch the iOS simulator app
        run: scripts/check-ios.sh
      - name: Link the iPhone device framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
      - name: Assemble the device and simulator XCFramework
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon
          xcodebuild -create-xcframework \
            -framework shared/build/bin/iosArm64/releaseFramework/Shared.framework \
            -framework shared/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework \
            -output "$RUNNER_TEMP/FerretShared.xcframework"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-check-results
          path: |
            ${{ runner.temp }}/ferret-ios.xcresult
            ${{ runner.temp }}/ferret-ios-launch.png
            shared/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: warn
